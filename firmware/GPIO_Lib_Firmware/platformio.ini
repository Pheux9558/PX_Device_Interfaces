[platformio]
default_envs = stm32f411

[env]
# extra_scripts = pre:tools/pio_pre_hook.py, post:tools/pio_post_hook.py
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.9.3
	adafruit/Adafruit SSD1306@^2.5.7
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	adafruit/Adafruit NeoPixel@^1.10.0
lib_extra_dirs = lib

[env:device]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
upload_port = /dev/ttyACM0
upload_speed = 921600
monitor_speed = 921600
build_flags_old_old_old_old_old = 
	-DBOARD=ARDUINO_UNO_R4_WIFI
	-DDEBUG_USE_GPIO
	-DDEBUG_LED_PIN=13
	-DDEBUG_BRIGHTNESS=64
	-DLCD_SUPPORT
	-DI2C_SUPPORT
	-DHD44780_SUPPORT
	-DOLED_SUPPORT
	-DDEBUG
	-DFASTLED_SUPPORT
	-DUART_SUPPORT
	-DENCODER_SUPPORT

# Uncomment the line below to run in interactive mode (allows editing build flags during build)
# PIO_INTERACTIVE = 1

[env:esp32_s3_r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 921600
build_flags =
	-DGPIOLIB_RTOS=1
	-DGPIOLIB_RTOSAL=1
	-DGPIOLIB_HAL=1
	-DGPIOLIB_TARGET_ESP32_S3_R8=1
	-DUART_SUPPORT
	-DI2C_SUPPORT
	-DSPI_SUPPORT
	-DLCD_SUPPORT
	-DOLED_SUPPORT
	-DFASTLED_SUPPORT
	-DENCODER_SUPPORT
	-DSTEPPER_SUPPORT
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:stm32f411]
platform = ststm32
board = blackpill_f411ce
framework = arduino
upload_protocol = stlink
debug_tool = stlink
upload_speed = 921600
monitor_speed = 921600
build_flags =
	-DGPIOLIB_RTOS=1
	-DGPIOLIB_RTOSAL=1
	-DGPIOLIB_HAL=1
	-DGPIOLIB_TARGET_STM32F411=1
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DUSBCON
	-DFASTLED_SUPPORT
	-DUART_SUPPORT
	-DI2C_SUPPORT
	-DSPI_SUPPORT
	-DOLED_SUPPORT
	-DENCODER_SUPPORT
	-DSTEPPER_SUPPORT
