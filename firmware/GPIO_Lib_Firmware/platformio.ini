[platformio]
default_envs = device

[env]
extra_scripts = pre:tools/pio_pre_hook.py, post:tools/pio_post_hook.py
lib_deps =
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit ST7735 and ST7789 Library@^1.9.3
lib_extra_dirs = lib

[env:device]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino
upload_port = /dev/ttyACM0
upload_speed = 921600
monitor_speed = 921600
build_flags = -DBOARD=ESP32_T_DONGLE_S3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DFASTLED_SUPPORT -DUART_SUPPORT -DI2C_SUPPORT -DSPI_SUPPORT -DLCD_SUPPORT -DIPS_SUPPORT

# Uncomment the line below to run in interactive mode (allows editing build flags during build)
# PIO_INTERACTIVE = 1
